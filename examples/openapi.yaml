openapi: 3.1.0
info:
  title: Fictional shop API
  version: 1.0.0
servers:
  - url: https://shop.example.test
security:
  - bearer: []
paths:
  /api/login:
    post:
      summary: Customer login
      security: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                username:
                  type: string
                password:
                  type: string
      responses:
        '200':
          description: Authenticated session
  /api/products:
    get:
      summary: Search product catalogue
      security: []
      parameters:
        - name: page
          in: query
          schema:
            type: integer
      responses:
        '200':
          description: Product page
  /api/users/{id}:
    get:
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Profile
components:
  securitySchemes:
    bearer:
      type: http
      scheme: bearer

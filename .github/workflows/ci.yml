name: Test and package
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install '.[reports,dev]'
      - run: python -m unittest discover -s tests -v
      - run: python -m build
      - run: botscope demo --output reports/demo --formats json,html,csv,xlsx,pdf
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install '.[reports,browser]'
      - run: python -m playwright install --with-deps chromium
      - run: python -m unittest discover -s tests -v
        env:
          BOTSCOPE_TEST_BROWSER: '1'
